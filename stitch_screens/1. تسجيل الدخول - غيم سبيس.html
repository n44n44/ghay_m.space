<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>تسجيل الدخول - غيم سبيس</title>
<!-- Google Font: Cairo -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Colors Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#172A46',
              sky: '#54B9F2',
              bg: '#F3F6FB',
              purple: '#8B7CF6',
              gold: '#FFC857',
            }
          },
          fontFamily: {
            sans: ['Cairo', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom Styles: General & Animations -->
<style data-purpose="custom-styling">
    body {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Smooth focus rings */
    .input-field:focus-within {
      border-color: #54B9F2;
      box-shadow: 0 0 0 3px rgba(84, 185, 242, 0.15);
    }
  </style>
</head>
<body class="bg-[#e9eff7] min-h-screen flex items-center justify-center p-0 sm:p-4 text-brand-navy selection:bg-brand-sky selection:text-white">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Container shaped as modern iOS viewport wrapper -->
<main class="w-full sm:max-w-[420px] bg-brand-bg min-h-screen sm:min-h-[852px] sm:max-h-[920px] sm:rounded-[44px] shadow-2xl relative flex flex-col justify-between overflow-hidden border border-slate-200/60" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: iOSStatusBar -->
<div class="w-full pt-3 px-7 pb-1 flex justify-between items-center z-30 select-none text-brand-navy" data-purpose="ios-status-bar">
<span class="text-xs font-semibold tracking-tight">9:41</span>
<div class="flex items-center gap-1.5">
<!-- Cellular Signal -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A10.93 10.93 0 0 1 1 12C1 5.92 5.92 1 12 1s11 4.92 11 11c0 2.3-.7 4.43-1.9 6.2l-.62-.6c1.07-1.55 1.52-3.41 1.52-5.6 0-4.97-4.03-9-9-9zM7.5 12c0-2.48 2.02-4.5 4.5-4.5s4.5 2.02 4.5 4.5c0 1.25-.51 2.38-1.33 3.19l-.71-.71A3.48 3.48 0 0 0 15.5 12c0-1.93-1.57-3.5-3.5-3.5S8.5 10.07 8.5 12c0 .97.39 1.84 1.03 2.47l-.71.71c-.82-.81-1.32-1.93-1.32-3.18z"></path>
</svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A17.88 17.88 0 0 0 12 4zm0 3.5c3.73 0 7.15 1.45 9.72 3.84L12 19.12 2.28 11.34A14.36 14.36 0 0 1 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-brand-navy rounded-sm p-0.5 flex items-center">
<div class="bg-brand-navy h-full w-full rounded-[1px]"></div>
</div>
</div>
</div>
<!-- END: iOSStatusBar -->
<!-- Cloud Decorative Wave Background Elements -->
<div class="absolute -top-16 -right-16 w-52 h-52 bg-brand-sky/15 rounded-full blur-2xl pointer-events-none"></div>
<div class="absolute top-44 -left-20 w-60 h-60 bg-brand-purple/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-10 right-0 w-64 h-64 bg-brand-sky/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- BEGIN: MainContentArea -->
<div class="flex-1 px-6 pt-2 pb-6 flex flex-col justify-between z-10" data-purpose="screen-content">
<!-- Header with Brand Logo & Identification -->
<header class="flex flex-col items-center text-center mt-2" data-purpose="app-branding">
<!-- Brand Logo -->
<div class="relative w-20 h-20 rounded-2xl bg-white p-2 shadow-lg shadow-brand-navy/5 flex items-center justify-center border border-slate-100 mb-3">
<img alt="شعار غيم سبيس" class="w-full h-full object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzjJNLY1b5l0buKQM-sAB1XrwxoyYNTMASIs0E7Sdawii7i0H14LxSNOQe2LQEHdXj_vATrlVxaWE3eTcXnIRTImS7GgrpGevpSUNoVSdbrNBVEy5UVIIFg9uyK9V2T3ZbBZz5Jpfa99H7x_IJ81SaZVPaIYu5OddGh1q5JRTqDwRGxPJbO8Lq4M7Mlim2VtnLrdN7ImqPiEpmdDMUBcVLnUlzo3Y69jRi2gCDsrUbC3D1eI3EaKk7Ww6bD_lvWAOlRg"/>
<span class="absolute -top-1 -right-1 w-3 h-3 bg-brand-gold rounded-full ring-2 ring-white"></span>
</div>
<!-- Brand Name & City Tag -->
<h1 class="text-xl font-bold text-brand-navy tracking-tight">غيم سبيس | Ghaym Space</h1>
<div class="flex items-center gap-1.5 mt-1">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-sky"></span>
<span class="text-xs font-semibold text-slate-500">سوق المكلا الرقمي الأول</span>
<span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-sky"></span>
</div>
</header>
<!-- BEGIN: LoginFormCard -->
<section class="bg-white rounded-3xl p-6 shadow-xl shadow-brand-navy/5 border border-slate-100/80 my-auto" data-purpose="login-card">
<!-- Title & Subtitle -->
<div class="text-center mb-6">
<h2 class="text-2xl font-extrabold text-brand-navy mb-1.5">مرحباً بك مجدداً</h2>
<p class="text-xs font-medium text-slate-500">سجل دخولك للمتابعة في استكشاف أفضل المنتجات</p>
</div>
<form action="#" class="space-y-4" data-purpose="login-form" method="POST" onsubmit="event.preventDefault();">
<!-- Phone or Email Field -->
<div data-purpose="identifier-input-group">
<label class="block text-xs font-bold text-brand-navy mb-1.5" for="identifier">رقم الهاتف أو البريد الإلكتروني</label>
<div class="input-field relative flex items-center bg-brand-bg rounded-xl border border-slate-200 transition-all duration-200">
<span class="pr-3.5 pl-1 text-slate-400">
<!-- User/Phone Icon -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-transparent border-0 py-2.5 pr-2 pl-3 text-sm font-medium text-brand-navy placeholder:text-slate-400 placeholder:text-xs focus:ring-0 focus:outline-none" id="identifier" name="identifier" placeholder="77xxxxxxx أو email@domain.com" required="" type="text"/>
</div>
</div>
<!-- Password Field -->
<div data-purpose="password-input-group">
<label class="block text-xs font-bold text-brand-navy mb-1.5" for="password">كلمة المرور</label>
<div class="input-field relative flex items-center bg-brand-bg rounded-xl border border-slate-200 transition-all duration-200">
<span class="pr-3.5 pl-1 text-slate-400">
<!-- Lock Icon -->
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-transparent border-0 py-2.5 pr-2 pl-2 text-sm font-medium text-brand-navy placeholder:text-slate-400 focus:ring-0 focus:outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<!-- Password Toggle Visibility Button -->
<button aria-label="إظهار أو إخفاء كلمة المرور" class="pl-3 pr-2 text-slate-400 hover:text-brand-navy focus:outline-none transition-colors" id="togglePassword" type="button">
<!-- Eye Icon -->
<svg class="w-4 h-4" fill="none" id="eyeIcon" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Remember Me & Forgot Password Row -->
<div class="flex items-center justify-between pt-1">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input class="w-4 h-4 rounded text-brand-sky border-slate-300 focus:ring-brand-sky focus:ring-offset-0 transition-colors" id="rememberMe" name="remember" type="checkbox"/>
<span class="text-xs font-semibold text-slate-600">تذكرني على هذا الجهاز</span>
</label>
<a class="text-xs font-bold text-brand-sky hover:text-sky-600 transition-colors" href="#">
              نسيت كلمة المرور؟
            </a>
</div>
<!-- Submit Button -->
<div class="pt-2">
<button class="w-full py-3.5 px-4 bg-brand-sky hover:bg-[#43a6dd] active:scale-[0.99] text-white font-bold text-sm rounded-xl shadow-lg shadow-brand-sky/30 transition-all duration-200 flex items-center justify-center gap-2 group" type="submit">
<span>دخول</span>
<svg class="w-4 h-4 transition-transform group-hover:-translate-x-1 rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</form>
<!-- Divider with Text -->
<div class="relative flex items-center my-5">
<div class="flex-grow border-t border-slate-200"></div>
<span class="flex-shrink mx-3 text-xs text-slate-400 font-medium">أو</span>
<div class="flex-grow border-t border-slate-200"></div>
</div>
<!-- Register Link Button -->
<div class="text-center">
<a class="block w-full py-2.5 px-4 rounded-xl border border-dashed border-brand-sky/60 hover:bg-brand-sky/5 text-brand-sky font-bold text-xs transition-colors" href="#">
            إنشاء حساب جديد
          </a>
</div>
</section>
<!-- END: LoginFormCard -->
<!-- Footer Tagline -->
<footer class="mt-4 text-center select-none" data-purpose="screen-footer">
<p class="text-[11px] font-semibold text-slate-400 flex items-center justify-center gap-1.5">
<span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-gold"></span>
          تجربة تسوق أفضل .. في مكان واحد
        </p>
</footer>
</div>
<!-- END: MainContentArea -->
<!-- BEGIN: iOSHomeIndicator -->
<div class="w-full pb-2 pt-1 flex justify-center items-center select-none z-30" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</main>
<!-- END: MobileDeviceContainer -->
<!-- Password Visibility Toggle Script -->
<script data-purpose="password-visibility-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');

      if (toggleBtn && passwordInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          if (isPassword) {
            eyeIcon.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            `;
          } else {
            eyeIcon.innerHTML = `
              <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            `;
          }
        });
      }
    });
  </script>
</body></html>
