<!DOCTYPE html>

<html dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>غيم سبيس - إنشاء حساب عميل جديد</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#172A46',
              primary: '#54B9F2',
              bg: '#F3F6FB',
              purple: '#887CF6',
              yellow: '#FFC857'
            }
          },
          fontFamily: {
            cairo: ['Cairo', 'Segoe UI', 'sans-serif']
          },
          boxShadow: {
            'soft': '0 10px 25px -5px rgba(23, 42, 70, 0.06), 0 8px 10px -6px rgba(23, 42, 70, 0.04)',
            'btn': '0 8px 20px -3px rgba(84, 185, 242, 0.4)'
          }
        }
      }
    }
  </script>
<!-- Google Fonts: Cairo -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-typography">
    body {
      font-family: 'Cairo', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input::placeholder {
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body class="bg-brand-bg min-h-screen text-slate-800 antialiased flex justify-center items-center p-0 sm:p-4">
<!-- BEGIN: MobileContainer -->
<!-- Container strictly tailored for mobile screen dimensions -->
<div class="w-full max-w-md min-h-screen bg-brand-bg relative overflow-hidden flex flex-col justify-between px-6 py-6 sm:rounded-3xl sm:min-h-[844px] sm:shadow-2xl sm:border sm:border-slate-100" data-purpose="mobile-viewport">
<!-- Decorative subtle background accents -->
<div class="absolute -top-24 -left-24 w-64 h-64 bg-[#54B9F2]/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute -bottom-20 -right-20 w-64 h-64 bg-[#887CF6]/10 rounded-full blur-3xl pointer-events-none"></div>
<div class="relative z-10 w-full">
<!-- BEGIN: TopNavigation -->
<!-- Top header bar containing the back button and status -->
<header class="flex items-center justify-between pt-2 pb-4" data-purpose="header-navigation">
<button aria-label="رجوع" class="w-10 h-10 rounded-xl bg-white border border-slate-200/70 shadow-sm flex items-center justify-center text-brand-dark hover:bg-slate-50 transition-all active:scale-95" type="button">
<!-- Back arrow pointing right for RTL layout -->
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8.25 4.5l7.5 7.5-7.5 7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-xs font-semibold px-3 py-1 rounded-full bg-blue-50 text-brand-primary border border-blue-100">
          خطوة 1 من 2
        </span>
</header>
<!-- END: TopNavigation -->
<!-- BEGIN: BrandingSection -->
<!-- Visual logo and title section -->
<section class="text-center mt-2 mb-6" data-purpose="branding-intro">
<div class="relative inline-block mb-3">
<img alt="شعار غيم سبيس" class="w-20 h-20 mx-auto rounded-2xl shadow-md object-cover transform hover:scale-105 transition-transform duration-300" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzjJNLY1b5l0buKQM-sAB1XrwxoyYNTMASIs0E7Sdawii7i0H14LxSNOQe2LQEHdXj_vATrlVxaWE3eTcXnIRTImS7GgrpGevpSUNoVSdbrNBVEy5UVIIFg9uyK9V2T3ZbBZz5Jpfa99H7x_IJ81SaZVPaIYu5OddGh1q5JRTqDwRGxPJbO8Lq4M7Mlim2VtnLrdN7ImqPiEpmdDMUBcVLnUlzo3Y69jRi2gCDsrUbC3D1eI3EaKk7Ww6bD_lvWAOlRg"/>
<div class="absolute -bottom-1 -right-1 w-5 h-5 bg-emerald-500 rounded-full border-2 border-white flex items-center justify-center">
<span class="w-2 h-2 rounded-full bg-white"></span>
</div>
</div>
<h1 class="text-2xl font-bold text-brand-dark tracking-tight">
          إنشاء حساب جديد
        </h1>
<p class="text-xs sm:text-sm text-slate-500 mt-1 max-w-xs mx-auto leading-relaxed">
          انضم لسوق غيم سبيس واطلب من أفضل متاجر المكلا
        </p>
</section>
<!-- END: BrandingSection -->
<!-- BEGIN: RegistrationForm -->
<form action="#" class="space-y-3.5" data-purpose="registration-form" method="POST">
<!-- Full Name Input -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-brand-dark pr-1">الاسم الكامل</label>
<div class="relative rounded-xl shadow-soft">
<input class="w-full h-12 pr-11 pl-4 bg-white border border-slate-200/80 rounded-xl text-sm focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 transition-all outline-none" name="fullname" placeholder="مثال: سالم باوزير" required="" type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
</div>
</div>
<!-- Phone Number Input with Yemen code -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-brand-dark pr-1">رقم الهاتف المحمول</label>
<div class="relative flex items-center rounded-xl shadow-soft bg-white border border-slate-200/80 focus-within:border-brand-primary focus-within:ring-2 focus-within:ring-brand-primary/20 transition-all">
<div class="flex items-center gap-1 px-3 py-3 border-l border-slate-100 bg-slate-50/70 rounded-r-xl select-none">
<span class="text-xs font-bold text-slate-700 dir-ltr font-mono">+967</span>
<svg class="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="w-full h-12 px-3 bg-transparent border-0 text-sm focus:ring-0 outline-none text-right placeholder:text-right" dir="ltr" name="phone" placeholder="7x xxx xxxx" required="" type="tel"/>
<div class="flex items-center pl-3.5 pointer-events-none text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-brand-dark pr-1">كلمة المرور</label>
<div class="relative rounded-xl shadow-soft">
<input class="w-full h-12 pr-11 pl-11 bg-white border border-slate-200/80 rounded-xl text-sm focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 transition-all outline-none" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<!-- Show/Hide Toggle Button -->
<button aria-label="إظهار كلمة المرور" class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 hover:text-brand-dark transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</button>
</div>
</div>
<!-- Confirm Password Input -->
<div class="space-y-1">
<label class="block text-xs font-semibold text-brand-dark pr-1">تأكيد كلمة المرور</label>
<div class="relative rounded-xl shadow-soft">
<input class="w-full h-12 pr-11 pl-4 bg-white border border-slate-200/80 rounded-xl text-sm focus:border-brand-primary focus:ring-2 focus:ring-brand-primary/20 transition-all outline-none" name="password_confirmation" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-3.5 pointer-events-none text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
</div>
</div>
<!-- Agreement Terms & Conditions Checkbox -->
<div class="pt-1.5 pb-2">
<label class="flex items-start gap-2.5 cursor-pointer">
<input class="w-4 h-4 mt-0.5 rounded text-brand-primary focus:ring-brand-primary/30 border-slate-300" required="" type="checkbox"/>
<span class="text-xs text-slate-600 leading-snug">
              أوافق على 
              <a class="text-brand-primary font-bold hover:underline" href="#">شروط الاستخدام</a> 
              و 
              <a class="text-brand-primary font-bold hover:underline" href="#">سياسة الخصوصية</a> 
              لمنصة غيم سبيس
            </span>
</label>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-brand-primary hover:bg-[#41aae4] active:scale-[0.98] text-white font-bold rounded-xl shadow-btn transition-all flex items-center justify-center gap-2 text-sm mt-4 tracking-wide" type="submit">
<span>متابعة والتحقق</span>
<svg class="w-4 h-4 rotate-180" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
</svg>
</button>
</form>
<!-- END: RegistrationForm -->
</div>
<!-- BEGIN: FooterAuthRedirect -->
<!-- Redirect to Sign-in screen -->
<footer class="pt-6 pb-2 text-center relative z-10" data-purpose="auth-redirect">
<div class="p-3 bg-white/70 backdrop-blur-sm rounded-2xl border border-slate-200/50 inline-block w-full">
<p class="text-xs sm:text-sm text-slate-600">
          لديك حساب بالفعل؟ 
          <a class="text-brand-primary font-bold hover:text-brand-dark transition-colors mr-1" href="#">
            تسجيل الدخول
          </a>
</p>
</div>
<!-- Home Indicator bar (iOS styled bar) -->
<div class="w-32 h-1 bg-slate-300/80 rounded-full mx-auto mt-4"></div>
</footer>
<!-- END: FooterAuthRedirect -->
</div>
<!-- END: MobileContainer -->
</body></html>
