<!-- Script for Auto-tabbing OTP Inputs -->
<script data-purpose="otp-handling">
    document.addEventListener('DOMContentLoaded', () => {
      const inputs = document.querySelectorAll('.otp-input');

      inputs.forEach((input, index) => {
        // Auto jump to next input
        input.addEventListener('input', (e) => {
          if (input.value.length >= 1) {
            input.value = input.value.slice(0, 1); // limit 1 digit
            if (index < inputs.length - 1) {
              inputs[index + 1].focus();
            }
          }
        });

        // Handle Backspace navigation
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !input.value && index > 0) {
            inputs[index - 1].focus();
          }
        });

        // Paste support
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pastedData = (e.clipboardData || window.clipboardData).getData('text').trim();
          if (/^\d+$/.test(pastedData)) {
            const digits = pastedData.split('');
            inputs.forEach((box, i) => {
              if (digits[i]) {
                box.value = digits[i];
              }
            });
            const nextEmptyIndex = Math.min(digits.length, inputs.length - 1);
            inputs[nextEmptyIndex].focus();
          }
        });
      });
    });
  </script>
<!-- Script for Countdown Timer Demonstration -->
<script data-purpose="countdown-timer">
    let remainingTime = 105; // 1 minute 45 seconds
    const countdownEl = document.getElementById('countdown');
    const resendBtn = document.getElementById('resend-btn');

    const updateTimer = () => {
      const minutes = Math.floor(remainingTime / 60);
      const seconds = remainingTime % 60;
      
      countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
      
      if (remainingTime > 0) {
        remainingTime--;
      } else {
        clearInterval(timerInterval);
        resendBtn.disabled = false;
        countdownEl.textContent = "00:00";
      }
    };

    const timerInterval = setInterval(updateTimer, 1000);
  </script>
